{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "Change my password" %}{% endblock %}
{% block content %}
<div class="card" style="max-width:480px">
  <h1>{% translate "Change my password" %}</h1>
  <form method="post">{% csrf_token %}
    {% for field in form %}{% include "includes/field.html" %}{% endfor %}
    <button class="btn btn-primary">{% translate "Save" %}</button>
  </form>
</div>
{% endblock %}
