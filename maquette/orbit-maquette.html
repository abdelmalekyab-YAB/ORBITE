<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit — Digitalia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070511;--s1:#100b20;--s2:#171130;--s3:#1f1840;--ink:#f6f3ff;--ink2:#c5bde0;--mute:#8b83ab;--line:#2b2349;--line2:#211a3c;
  --grad:linear-gradient(95deg,#e04bff 0%,#a21caf 45%,#7c3aed 100%);--violet:#a855f7;--vsoft:rgba(168,85,247,.16);
  --neon:#3dffb7;--nsoft:rgba(61,255,183,.13);--amber:#ffc14d;--asoft:rgba(255,193,77,.14);--rose:#ff6b8a;--rsoft:rgba(255,107,138,.15);--cyan:#3de1ff;--csoft:rgba(61,225,255,.13);
  --r:18px;--rs:12px;--pill:99px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;color:var(--ink);background:radial-gradient(1000px 520px at 85% -10%,rgba(124,58,237,.30),transparent 60%),radial-gradient(800px 500px at -5% 105%,rgba(224,75,255,.14),transparent 60%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em}
h1{font-size:30px;font-weight:700}h2{font-size:17px;font-weight:600}h3{font-size:14px;font-weight:600}
p{margin:0}a{color:var(--violet);text-decoration:none;cursor:pointer}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- shell ---- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:14px 32px;background:rgba(7,5,17,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line2)}
.logo{display:flex;align-items:center;gap:10px;font-family:"Space Grotesk";font-weight:700;font-size:20px;color:#fff}
.logo svg{width:30px;height:30px}
.logo i{width:7px;height:7px;border-radius:50%;background:var(--grad);margin-top:8px;margin-left:-6px}
.ctx{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border:1px solid var(--line);border-radius:var(--pill);background:var(--s1);font-weight:600;cursor:pointer}
.ctx .dot{width:8px;height:8px;border-radius:50%}
.tabs{display:flex;gap:2px;margin-left:auto;padding:4px;border:1px solid var(--line);border-radius:var(--pill);background:var(--s1)}
.tabs button{border:0;background:none;color:var(--mute);padding:7px 16px;border-radius:var(--pill);font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--s3);color:#fff}
.tabs .n{background:var(--grad);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:0 7px;line-height:18px}
.tabs .n.neon{background:var(--neon);color:#062b1c}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--pill);border:1px solid var(--line);background:var(--s2);color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--s3)}
.btn.white{background:#fff;color:#0b0716;border-color:#fff;font-weight:700}
.btn.white:hover{background:#efe9ff;box-shadow:0 0 0 4px rgba(224,75,255,.25)}
.btn.grad{background:var(--grad);border-color:transparent;color:#fff;font-weight:700}
.btn.grad:hover{filter:brightness(1.12)}
.btn.neon{background:var(--nsoft);border-color:rgba(61,255,183,.45);color:var(--neon)}
.btn.rose{background:var(--rsoft);border-color:rgba(255,107,138,.4);color:var(--rose)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn svg{width:15px;height:15px}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:0 0 30px}
.av.sm{width:22px;height:22px;font-size:9px;flex-basis:22px}
.wrap{max-width:1240px;margin:0 auto;padding:30px 32px 90px}
@media (max-width:900px){.top{padding:10px 14px;flex-wrap:wrap}.tabs{order:3;width:100%;margin:0;overflow-x:auto}.wrap{padding:18px 14px 90px}h1{font-size:24px}}

/* ---- cards & bits ---- */
.card{background:rgba(16,11,32,.82);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(8px)}
.card.tight{padding:14px 16px}
.card h2{margin-bottom:14px;display:flex;align-items:center;gap:10px}
.card h2 .cnt{font-size:12px;color:var(--mute);font-weight:600;font-family:Inter}
.g2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}.g2>*{min-width:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1000px){.g2,.g3{grid-template-columns:1fr}}
.ball{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.ball::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.ball.you{background:var(--nsoft);color:var(--neon)}.ball.dig{background:var(--vsoft);color:#d8b4fe}.ball.done{background:rgba(255,255,255,.06);color:var(--mute)}.ball.done::before{box-shadow:none}
.ball.late{background:var(--rsoft);color:var(--rose)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--s3);color:var(--ink2)}
.tag.bug{background:var(--rsoft);color:var(--rose)}.tag.evo{background:var(--csoft);color:var(--cyan)}.tag.q{background:var(--asoft);color:var(--amber)}.tag.int{background:rgba(255,255,255,.06);color:var(--mute)}
.hint{color:var(--mute);font-size:12.5px}
.muted{color:var(--mute)}
.late{color:var(--rose);font-weight:700}
.empty{text-align:center;color:var(--mute);padding:26px 10px}.empty b{display:block;color:var(--ink);margin-bottom:3px;font-family:"Space Grotesk"}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--s1);border-radius:99px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2)}
.chip.on{background:#fff;color:#0b0716;border-color:#fff}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--s1);border-radius:99px;padding:6px 14px;min-width:220px;flex:1}
.search svg{width:16px;height:16px;flex:0 0 16px;color:var(--mute)}
.search input{border:0;background:none;flex:1;min-width:0}
.search input:focus{outline:none}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.field{display:grid;gap:6px;font-weight:600;font-size:13px}
.field input,.field select,.field textarea{padding:10px 13px;border:1px solid var(--line);border-radius:var(--rs);background:#0c0819;color:var(--ink);font-weight:400;width:100%}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px var(--vsoft)}
.prog{height:7px;background:var(--line2);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--grad);border-radius:99px}
.prog.neon i{background:var(--neon)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#fff;color:#0b0716;padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:.2s;z-index:60;pointer-events:none;box-shadow:0 10px 30px -10px rgba(224,75,255,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- request row with track ---- */
.req{display:grid;grid-template-columns:1fr auto;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(23,17,48,.55);cursor:pointer;margin-bottom:10px;transition:border-color .15s}
.req:hover{border-color:rgba(168,85,247,.55)}
.req .t{font-weight:600;font-size:15px;margin:2px 0 6px}
.req .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.req .meta .ref{font-weight:700;color:var(--ink2)}
.req .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:140px}
.track{display:flex;align-items:center;gap:0;margin-top:10px}
.track span{position:relative;flex:1;height:4px;background:var(--line2);border-radius:99px}
.track span+span{margin-left:4px}
.track span.done{background:var(--violet)}
.track span.cur{background:var(--grad);box-shadow:0 0 10px rgba(224,75,255,.6)}
.track span.ok{background:var(--neon)}
.track.lbl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:14px 0 4px}
.track.lbl div{font-size:11.5px;color:var(--mute);font-weight:600}
.track.lbl div i{display:block;height:5px;border-radius:99px;background:var(--line2);margin-bottom:6px}
.track.lbl div.done i{background:var(--violet)}.track.lbl div.cur i{background:var(--grad);box-shadow:0 0 10px rgba(224,75,255,.6)}.track.lbl div.cur{color:#fff}.track.lbl div.ok i{background:var(--neon)}.track.lbl div.ok{color:var(--neon)}
.step-now{font-size:12.5px;font-weight:600;color:var(--ink2)}

/* ---- home hero ---- */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:28px 30px;border-radius:24px;background:linear-gradient(120deg,rgba(124,58,237,.22),rgba(224,75,255,.08) 60%,transparent),rgba(16,11,32,.85);border:1px solid var(--line);margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;border:1px solid rgba(168,85,247,.25);pointer-events:none}
.hero::before{content:"";position:absolute;right:-30px;top:-30px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(61,255,183,.25);pointer-events:none}
.hero h1{margin:6px 0 8px}.hero .sub{color:var(--ink2);font-size:15px;max-width:560px}
.hero .health{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px}
.h-ok{background:var(--nsoft);color:var(--neon);border:1px solid rgba(61,255,183,.35)}.h-watch{background:var(--asoft);color:var(--amber);border:1px solid rgba(255,193,77,.35)}.h-late{background:var(--rsoft);color:var(--rose);border:1px solid rgba(255,107,138,.35)}
.hero .kpis{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.hero .kpis div{font-size:12.5px;color:var(--mute);font-weight:600}
.hero .kpis b{display:block;font-family:"Space Grotesk";font-size:26px;color:#fff;letter-spacing:-.02em;line-height:1.1}
.hero .kpis b.neon{color:var(--neon)}.hero .kpis b.rose{color:var(--rose)}
.ring{position:relative;width:150px;height:150px;flex:0 0 150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}.ring .tr{stroke:var(--line2)}.ring .pr{stroke:url(#rg);transition:stroke-dashoffset .8s ease}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .lbl b{font-family:"Space Grotesk";font-size:30px;letter-spacing:-.03em;line-height:1}.ring .lbl span{font-size:11px;color:var(--mute);font-weight:600;margin-top:2px}
@media (max-width:700px){.hero{grid-template-columns:1fr}.ring{display:none}}

/* ---- action cards (à vous) ---- */
.act{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px 18px;border-radius:16px;border:1px solid rgba(61,255,183,.35);background:linear-gradient(90deg,var(--nsoft),transparent 70%),rgba(16,11,32,.85);margin-bottom:10px}
.act .ico{width:42px;height:42px;border-radius:12px;background:var(--nsoft);display:grid;place-items:center;color:var(--neon);font-size:18px}
.act.q{border-color:rgba(255,193,77,.35);background:linear-gradient(90deg,var(--asoft),transparent 70%),rgba(16,11,32,.85)}.act.q .ico{background:var(--asoft);color:var(--amber)}
.act .t{font-weight:700;font-size:15px}.act .d{color:var(--ink2);font-size:13px;margin-top:2px}
.act .bt{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:700px){.act{grid-template-columns:auto 1fr}.act .bt{grid-column:1/-1}}

/* ---- feed ---- */
.feed{display:grid;gap:0}
.fe{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:8px 0}
.fe .l{position:relative}.fe .l::before{content:"";position:absolute;left:8px;top:0;bottom:-10px;width:2px;background:var(--line2)}
.fe .l i{position:relative;z-index:1;display:block;width:18px;height:18px;border-radius:50%;background:var(--s3);border:2px solid var(--line);margin-top:2px}
.fe .l i.n{background:var(--neon);border-color:var(--neon)}.fe .l i.v{background:var(--violet);border-color:var(--violet)}
.fe:last-child .l::before{display:none}
.fe .b{font-size:13px;color:var(--ink2)}.fe .b b{color:#fff;font-weight:600}.fe .b .when{color:var(--mute);font-size:12px;margin-top:1px}

/* ---- roadmap ---- */
.versions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
@media (max-width:900px){.versions{grid-template-columns:1fr}}
.ver{padding:18px;border-radius:18px;border:1px solid var(--line);background:rgba(16,11,32,.82);cursor:pointer;position:relative}
.ver.on{border-color:var(--violet);box-shadow:0 0 0 3px var(--vsoft)}
.ver .st{position:absolute;right:14px;top:14px}
.ver h2{font-size:20px;margin-bottom:4px}
.ver .d{color:var(--mute);font-size:12.5px;margin-bottom:12px}
.ver .n{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-top:8px;font-weight:600}

/* ---- drawer ---- */
.ov{position:fixed;inset:0;background:rgba(3,2,10,.6);backdrop-filter:blur(3px);z-index:40;display:none}
.ov.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--s1);border-left:1px solid var(--line);z-index:45;transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer .dh{position:sticky;top:0;background:rgba(16,11,32,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2);padding:16px 24px;display:flex;align-items:center;gap:12px;z-index:2}
.drawer .db{padding:22px 24px 40px;display:grid;gap:18px}
.drawer h1{font-size:22px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px}.kv span:nth-child(odd){color:var(--mute);font-weight:600}
.kv select,.kv input{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#0c0819;color:var(--ink);width:100%}
.msg{display:flex;gap:10px;margin-bottom:12px}
.msg .b{flex:1;background:var(--s2);border-radius:14px;padding:10px 14px;border-top-left-radius:4px}
.msg.me{flex-direction:row-reverse}.msg.me .b{background:var(--vsoft);border-radius:14px;border-top-right-radius:4px}
.msg .h{font-size:12px;color:var(--mute);margin-bottom:3px}.msg .h b{color:var(--ink)}
.compose{display:grid;gap:8px}
.compose textarea{padding:12px;border:1px solid var(--line);border-radius:14px;background:#0c0819;color:var(--ink);min-height:80px;resize:vertical}
.desc{white-space:pre-wrap;color:var(--ink2);line-height:1.65}
.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;font-weight:600}
.banner .bt{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.b-you{background:var(--nsoft);border:1px solid rgba(61,255,183,.35);color:var(--neon)}.b-q{background:var(--asoft);border:1px solid rgba(255,193,77,.35);color:var(--amber)}.b-dig{background:var(--vsoft);border:1px solid rgba(168,85,247,.35);color:#e9d5ff}.b-ok{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink2)}
.hist{font-size:12.5px;color:var(--mute);display:grid;gap:6px}.hist b{color:var(--ink2);font-weight:600}

/* ---- landing ---- */
.land{position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column}
.land canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.land .lt{position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding:22px 40px}
.land .lt .dl{display:flex;align-items:center;gap:10px;font-family:"Space Grotesk";font-weight:700;letter-spacing:.18em;font-size:15px;color:#fff}
.land .lt img{height:34px;width:auto}
.land .lt .sp{flex:1}
.land .lb{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:40px;max-width:1200px;width:100%;margin:0 auto;padding:20px 40px 60px}
@media (max-width:900px){.land .lb{grid-template-columns:1fr}.land .lt{padding:16px 20px}.land .lb{padding:10px 20px 40px}}
.land .tagl{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(61,255,183,.5);color:var(--neon);border-radius:99px;padding:7px 16px;font-weight:700;font-size:12.5px;letter-spacing:.06em;box-shadow:0 0 28px rgba(61,255,183,.18);margin-bottom:24px;background:rgba(7,5,17,.5)}
.land h1{font-size:60px;line-height:1.02;letter-spacing:-.035em;color:#fff;margin-bottom:18px}
.land h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.land .lead{font-size:17px;color:var(--ink2);max-width:520px;line-height:1.65;margin-bottom:28px}
.land .cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.land .cta .btn{padding:14px 26px;font-size:15px}
.land .feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:40px}
@media (max-width:600px){.land .feat{grid-template-columns:1fr}.land h1{font-size:40px}}
.land .feat div{padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(16,11,32,.65);backdrop-filter:blur(6px)}
.land .feat b{display:block;font-family:"Space Grotesk";margin-bottom:3px;color:#fff}.land .feat span{font-size:12.5px;color:var(--mute)}
.orb{position:relative;width:min(100%,520px);aspect-ratio:1;margin:0 auto}
.orb .ring{position:absolute;inset:0;width:auto;height:auto;flex:none;border-radius:50%;border:1px solid rgba(168,85,247,.28);animation:spin linear infinite}
.orb .r1{inset:6%;animation-duration:38s}.orb .r2{inset:20%;animation-duration:26s;animation-direction:reverse;border-color:rgba(61,255,183,.25)}.orb .r3{inset:34%;animation-duration:18s;border-color:rgba(224,75,255,.3)}
.orb .ring::after{content:"";position:absolute;inset:-1px;border-radius:50%;background:conic-gradient(from 0deg,transparent 70%,rgba(224,75,255,.35),transparent);mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px))}
.orb .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(224,75,255,.35),rgba(124,58,237,.15) 60%,transparent 70%),rgba(16,11,32,.9);border:1px solid rgba(168,85,247,.5);display:grid;place-items:center;box-shadow:0 0 60px rgba(124,58,237,.45),0 0 120px rgba(224,75,255,.15)}
.orb .core img{width:88px;height:auto;filter:drop-shadow(0 0 12px rgba(61,255,183,.5))}
.orb .core small{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:"Space Grotesk";font-weight:700;letter-spacing:.14em;font-size:11px;color:var(--ink2)}
.orb .sat{position:absolute;inset:0;animation:spin linear infinite}
.orb .sat>div{position:absolute;margin:-16px 0 0 -40px;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:99px;background:rgba(16,11,32,.92);border:1px solid var(--line);font-weight:700;font-size:12.5px;white-space:nowrap;box-shadow:0 0 20px rgba(124,58,237,.35);animation:spin linear infinite reverse}
.orb .sat>div i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
.orb .dot{position:absolute;inset:0;animation:spin linear infinite}
.orb .dot span{position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 10px var(--neon);transform:translate(-50%,-50%)}

function landing(){const sats=[['WWS','#7c3aed',6,38,'0s'],['RM Club','#a04bb5',20,26,'-9s'],['Bodytime','#c2410c',6,38,'-19s'],['Vous ?','#0b8a9c',20,26,'-13s']];

  <div class="lt"><div class="dl"><img src="${DLOGO}" alt="Digitalia">DIGITALIA</div><span class="sp"></span><button class="btn" data-showlogin>Se connecter</button></div>
  <div class="lb"><div><div class="tagl">✦ DÉVELOPPÉ PAR DIGITALIA POUR SES CLIENTS</div><h1>Orbit<br><span>vos projets, en orbite autour de vous</span></h1>
    <p class="lead">Orbit est l'espace commun entre Digitalia et chacun de ses clients : suivez l'état de vos projets en production, signalez un problème, demandez une évolution, testez ce qui est livré. À chaque instant, vous savez qui a la main.</p>
    <div class="cta"><button class="btn white" data-showlogin>Accéder à mon espace →</button><a class="btn ghost" href="https://digitalia-ltd.com" target="_blank" rel="noopener">digitalia-ltd.com</a></div>
    <div class="feat"><div><b>Transparence</b><span>L'état réel de chaque demande, sans relancer.</span></div><div><b>Un seul endroit</b><span>Bugs, évolutions, questions, tests : tout passe par Orbit.</span></div><div><b>La balle est chez qui</b><span>Chez vous ou chez Digitalia, c'est toujours clair.</span></div></div></div>
    <div class="orb"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      ${sats.map(([n,c,r,d,dl],i)=>`<div class="sat" style="animation-duration:${d}s;animation-delay:${dl}"><div style="left:${r}%;top:50%;animation-duration:${d}s;animation-delay:${dl}"><i style="background:${c}">${n.split(' ').map(x=>x[0]).join('').slice(0,2)}</i>${n}</div></div>`).join('')}
      ${[0,1,2,3,4,5].map(i=>`<div class="dot" style="animation-duration:${14+i*5}s;animation-delay:-${i*3}s;transform:rotate(${i*61}deg)"><span style="position:absolute;left:${[16,30,44,16,30,44][i]}%"></span></div>`).join('')}
      <div class="core"><img src="${DLOGO}" alt="Digitalia"><small>DIGITALIA</small></div></div></div></div>`}
function startStars(){const c=$('#stars');if(!c||!c.getContext)return;const ctx=c.getContext('2d');if(!ctx)return;let W,H,pts=[];const rs=()=>{W=c.width=c.offsetWidth;H=c.height=c.offsetHeight;pts=Array.from({length:Math.min(160,W/8)},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.6+.2,v:Math.random()*.2+.05}))};rs();
  if(window._starsRaf)cancelAnimationFrame(window._starsRaf);window.addEventListener('resize',rs,{once:true});
  const frame=()=>{if(!document.body.contains(c))return;ctx.clearRect(0,0,W,H);
    const g=ctx.createRadialGradient(W*.75,H*.3,20,W*.75,H*.3,W*.6);g.addColorStop(0,'rgba(124,58,237,.22)');g.addColorStop(.5,'rgba(224,75,255,.06)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(168,85,247,.10)';ctx.lineWidth=1;for(let i=0;i<7;i++){ctx.beginPath();for(let x=0;x<=W;x+=20){const y=H*.55+i*26+Math.sin(x/140+i*.7+performance.now()/2600)*22+Math.sin(x/47+i)*6;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
    pts.forEach(p=>{p.y-=p.v;if(p.y<0){p.y=H;p.x=Math.random()*W}ctx.fillStyle=`rgba(255,255,255,${p.z})`;ctx.beginPath();ctx.arc(p.x,p.y,p.z*1.4,0,7);ctx.fill()});
    window._starsRaf=requestAnimationFrame(frame)};frame()}

const digIds=()=>Object.values(USERS).filter(u=>u.role==='dig'&&u.active!==false).map(u=>u.id);

function dTriage(){const q=TICKETS.filter(t=>t.status==='nouveau'||t.status==='analyser');if(!state.triage||!q.find(t=>t.id===state.triage))state.triage=q[0]?.id||null;const t=q.find(x=>x.id===state.triage);

    <label class="field">Date cible<input type="date" data-f="due" value="${t.due||''}"></label>

const KCOL_C={devis:'var(--amber)',nouveau:'#d8b4fe',analyser:'var(--amber)',faire:'var(--mute)',cours:'var(--violet)',testint:'var(--cyan)',termine:'#fff'};

function kbList(p){const f=state.kf||{};let l=TICKETS.filter(t=>!p||t.project===p);if(f.project)l=l.filter(t=>t.project===f.project);if(f.type)l=l.filter(t=>t.type===f.type);

function projFin(p){const f=finSummary(p);const hc=p.fin.cost&&p.fin.cost.mode!=='none';const months=[];for(let i=-5;i<=6;i++)months.push(addM(ymNow,i));const maxBar=Math.max(1,...months.map(m=>revenue(p,m)));

function userEditRow(u,cols){return `<tr><td colspan="${cols}" style="background:var(--vsoft)"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end" id="uedit-form"><label class="field" style="flex:1;min-width:140px">Nom<input data-ue="name" value="${esc(u.name)}"></label><label class="field" style="flex:1;min-width:180px">E-mail<input data-ue="email" type="email" value="${esc(u.email)}"></label><button class="btn grad sm" data-uesave="${u.id}">${IC.chk} Enregistrer</button><button class="btn ghost sm" data-uecancel>Annuler</button></div></td></tr>`}
function dAccess(){return `<h1 style="margin-bottom:4px">Accès</h1><p class="hint" style="margin-bottom:18px">Qui accède à Orbit et à quoi : l'équipe Digitalia, les clients et leurs utilisateurs, les projets.</p><div class="settings" style="max-width:none"><div class="card"><h2>Équipe Digitalia <span class="cnt">${digIds().length} membres actifs</span></h2><p class="hint" style="margin-bottom:10px">Qui fait partie de l'équipe et ce qu'il peut faire. Développeur : cockpit, kanban, projets, équipe. Chef de projet : + triage et réglages. Administrateur : + finances et gestion des accès.</p>
    <div style="overflow-x:auto"><table><thead><tr><th>Membre</th><th>E-mail</th><th>Rôle</th><th>Statut</th><th></th></tr></thead><tbody>${Object.values(USERS).filter(u=>u.role==='dig').map(u=>`<tr style="${u.active===false?'opacity:.5':''}"><td>${av(u,1)} <b>${esc(u.name)}</b></td><td class="hint">${esc(u.email)}</td><td><select class="fin-in" style="width:auto;text-align:left" data-job="${u.id}" ${u.id===state.user.id?'disabled':''}>${Object.entries(JOBS).map(([k,l])=>`<option value="${k}" ${u.job===k?'selected':''}>${l}</option>`).join('')}</select></td><td>${u.pending?'<span class="ball dig">Invitation envoyée</span>':u.active===false?'<span class="ball done">Désactivé</span>':'<span class="ball you">Actif</span>'}</td><td style="white-space:nowrap"><button class="btn ghost sm" data-uedit="${u.id}">Modifier</button>${u.pending?`<button class="btn ghost sm" data-toast="Invitation renvoyée à ${esc(u.email)}">Renvoyer</button>`:`<button class="btn ghost sm" data-toast="E-mail de réinitialisation envoyé à ${esc(u.email)}">Mot de passe</button>`}${u.id===state.user.id?'':`<button class="btn ghost sm" data-team="${u.active===false?'enable':'disable'}" data-id="${u.id}">${u.active===false?'Réactiver':'Désactiver'}</button>`}</td></tr>${state.editUser===u.id?userEditRow(u,5):''}`).join('')}</tbody></table></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:end" id="team-form"><label class="field" style="flex:1;min-width:140px">Nom<input data-tf="name" placeholder="Prénom Nom"></label><label class="field" style="flex:1;min-width:180px">E-mail<input data-tf="email" type="email" placeholder="prenom@digitalia.io"></label><label class="field">Rôle<select data-tf="job">${Object.entries(JOBS).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label><button class="btn grad" data-teamsave>${IC.plus} Inviter</button></div><p class="hint" style="margin-top:6px">La personne reçoit un e-mail pour créer son mot de passe.</p></div>
  <div class="card"><h2>Clients et accès</h2><p class="hint" style="margin-bottom:10px">Un utilisateur client ne voit que les projets qu'on lui ouvre. Un client peut avoir plusieurs projets et plusieurs utilisateurs.</p>
    ${CLIENTS.map(c=>{const ps=PROJECTS.filter(p=>p.client===c.id);return `<div style="padding:12px 0;border-bottom:1px solid var(--line2)"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h3>${c.name} <span class="hint" style="font-weight:500">· ${ps.map(p=>p.name).join(', ')}</span></h3></div>
      <table style="margin-top:8px"><thead><tr><th>Utilisateur</th><th>E-mail</th><th>Accès aux projets</th><th></th></tr></thead><tbody>${c.users.map(uid=>{const u=USERS[uid];return `<tr style="${u.active===false?'opacity:.5':''}"><td>${av(u,1)} <b>${esc(u.name)}</b>${u.pending?' <span class="ball dig" style="font-size:10.5px">invité</span>':''}</td><td class="hint">${esc(u.email)}</td><td><div class="chips" style="gap:4px">${ps.map(p=>`<button class="chip ${(u.projects||[]).includes(p.key)?'on':''}" style="padding:3px 9px;font-size:11.5px" data-cuser="access" data-id="${uid}" data-key="${p.key}">${p.name}</button>`).join('')}</div></td><td style="white-space:nowrap"><button class="btn ghost sm" data-uedit="${uid}">Modifier</button>${u.pending?`<button class="btn ghost sm" data-toast="Invitation renvoyée à ${esc(u.email)}">Renvoyer</button>`:`<button class="btn ghost sm" data-toast="E-mail de réinitialisation envoyé à ${esc(u.email)}">Mot de passe</button>`}<button class="btn ghost sm" data-cuser="${u.active===false?'enable':'disable'}" data-id="${uid}">${u.active===false?'Réactiver':'Désactiver'}</button></td></tr>${state.editUser===uid?userEditRow(u,4):''}`}).join('')}</tbody></table>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:end" data-cform="${c.id}"><label class="field" style="flex:1;min-width:140px"><input data-cf="name" placeholder="Prénom Nom"></label><label class="field" style="flex:1;min-width:180px"><input data-cf="email" type="email" placeholder="email@client.fr"></label><button class="btn sm" data-cusersave="${c.id}">${IC.plus} Inviter un utilisateur</button></div></div>`}).join('')}
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)"><h3 style="margin-bottom:8px">Nouveau client</h3><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end" id="client-form"><label class="field" style="flex:1;min-width:160px">Nom de l'entreprise<input data-clf="name" placeholder="Ex. : Atlas Énergie"></label><label class="field" style="flex:1;min-width:160px">Premier contact (nom)<input data-clf="uname" placeholder="Prénom Nom"></label><label class="field" style="flex:1;min-width:180px">E-mail du contact<input data-clf="email" type="email" placeholder="contact@client.fr"></label><button class="btn grad" data-clientsave>${IC.plus} Créer le client</button></div><p class="hint" style="margin-top:6px">Le contact reçoit une invitation ; vous lui ouvrirez des projets ensuite.</p></div></div>
  <div class="card"><h2>Projets <span class="cnt">${PROJECTS.length}</span></h2><div style="overflow-x:auto"><table><thead><tr><th>Clé</th><th>Projet</th><th>Client</th><th>Responsable</th><th class="n">Ouvertes</th><th>Statut</th><th></th></tr></thead><tbody>${PROJECTS.map(p=>`<tr style="${p.archived?'opacity:.5':''}"><td><b>${p.key}</b></td><td>${esc(p.name)}<div class="hint">${esc(p.desc||'')}</div></td><td>${client(p.client).name}</td><td><select class="fin-in" style="width:auto;text-align:left" data-plead="${p.key}">${digIds().map(u=>`<option value="${u}" ${p.lead===u?'selected':''}>${USERS[u].name}</option>`).join('')}</select></td><td class="n">${TICKETS.filter(t=>t.project===p.key&&isOpen(t)).length}</td><td>${p.archived?'<span class="ball done">Archivé</span>':'<span class="ball you">En production</span>'}</td><td style="white-space:nowrap"><button class="btn ghost sm" data-project="${p.key}">Ouvrir</button><button class="btn ghost sm" data-parch="${p.key}">${p.archived?'Réactiver':'Archiver'}</button></td></tr>`).join('')}</tbody></table></div>
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)"><h3 style="margin-bottom:8px">Nouveau projet</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;align-items:end" id="project-form"><label class="field">Nom<input data-pf="name" placeholder="Ex. : Portail RH"></label><label class="field">Clé (3-4 lettres)<input data-pf="key" placeholder="PRH" maxlength="4" style="text-transform:uppercase"></label><label class="field">Client<select data-pf="client">${CLIENTS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></label><label class="field">Responsable<select data-pf="lead">${digIds().map(u=>`<option value="${u}">${USERS[u].name}</option>`).join('')}</select></label><label class="field">Prix du dev (€)<input data-pf="devPrice" type="number" placeholder="0"></label><label class="field">Licence / mois (€)<input data-pf="licence" type="number" placeholder="0"></label><label class="field" style="grid-column:1/-1">Description<input data-pf="desc" placeholder="En une phrase"></label><button class="btn grad" data-projectsave style="justify-self:start">${IC.plus} Créer le projet</button></div><p class="hint" style="margin-top:6px">Les utilisateurs du client reçoivent l'accès au nouveau projet ; vous pourrez l'ajuster dans « Clients et accès ».</p></div></div></div>`}
function dSettings(){return `<h1 style="margin-bottom:4px">Réglages</h1><p class="hint" style="margin-bottom:18px">Workflow et notifications. ${isAdmin()?'Les utilisateurs, clients et projets sont dans l\'onglet <a data-tab="access">Accès</a>.':''}</p><div class="settings">
  <div class="card"><h2>Workflow <span class="cnt">configurable</span></h2><p class="hint" style="margin-bottom:12px">Chaque statut interne : le nom que voit le client, chez qui est la balle, et vers quels statuts on peut aller. Les modifications s'appliquent immédiatement au kanban, aux fiches et à l'espace client.</p>
    <div style="overflow-x:auto"><table class="wft"><thead><tr><th></th><th>Statut interne</th><th>Étape vue par le client</th><th>La balle est chez</th><th>Transitions autorisées</th><th></th></tr></thead><tbody>
    ${WF.map((w,i)=>`<tr><td style="white-space:nowrap"><button class="btn ghost sm" data-wfmove="${i}" data-dir="-1" ${i===0?'disabled':''}>▲</button><button class="btn ghost sm" data-wfmove="${i}" data-dir="1" ${i===WF.length-1?'disabled':''}>▼</button></td>
      <td><input class="fin-in" style="width:150px;text-align:left" value="${esc(w.l)}" data-wf="l" data-i="${i}"></td>
      <td><input class="fin-in" style="width:170px;text-align:left" value="${esc(w.client)}" data-wf="client" data-i="${i}" ${w.closed?'disabled':''}></td>
      <td><select class="fin-in" style="width:auto;text-align:left" data-wf="ball" data-i="${i}" ${w.closed?'disabled':''}><option value="dig" ${w.ball==='dig'?'selected':''}>Digitalia</option><option value="client" ${w.ball==='client'?'selected':''}>Client</option>${w.closed?'<option selected>— clôturé</option>':''}</select></td>
      <td><div class="chips" style="gap:4px">${WF.filter(x=>x.k!==w.k).map(x=>`<button class="chip ${w.next.includes(x.k)?'on':''}" style="padding:3px 9px;font-size:11.5px" data-wfnext="${i}" data-k="${x.k}">${esc(x.l)}</button>`).join('')}</div></td>
      <td>${['nouveau','termine','refuse','annule'].includes(w.k)?'':`<button class="btn ghost sm" data-wfdel="${i}" title="Supprimer">${IC.x}</button>`}</td></tr>`).join('')}</tbody></table></div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-wfadd>${IC.plus} Ajouter un statut</button><button class="btn ghost sm" data-wfreset>Revenir au workflow par défaut</button></div></div>
  <div class="card"><h2>Ce que voit le client</h2><p class="hint" style="margin-bottom:12px">La piste affichée au client, déduite du workflow ci-dessus.</p><div class="workflow">${STEPS.map((s,i)=>`<span class="ball ${i===STEPS.length-1?'you':'dig'}">${s}</span>${i<STEPS.length-1?'<span class="muted">›</span>':''}`).join('')}</div></div>
  <div class="card"><h2>Notifications au client</h2><p class="hint" style="margin-bottom:10px">Uniquement quand ça le concerne.</p>${['La demande est reçue et qualifiée','Elle est planifiée dans une version (avec la date)','Une précision lui est demandée','Elle est prête à tester','Elle est livrée','Rappel après 3 jours sans réponse'].map((x,i)=>`<label style="display:flex;gap:10px;align-items:center;padding:6px 0"><input type="checkbox" ${i<5?'checked':''}> ${x}</label>`).join('')}</div>

  </div>`}

/* ---------- DRAWER ---------- */
function renderDrawer(){const d=$('#drawer');const ov=$('#ov');const t=state.drawer&&TICKETS.find(x=>x.id===state.drawer);
  if(!t){d.classList.remove('show');ov.classList.remove('show');d.innerHTML='';return}
  const p=proj(t.project);const a=USERS[t.assignee];const subs=TICKETS.filter(x=>x.parent===t.id);const par=t.parent&&TICKETS.find(x=>x.id===t.parent);
  let banner='';
  if(!isDig()){
    if(t.status==='test')banner=`<div class="banner b-you">🧪 Prêt à tester. Dites-nous si c'est bon.<div class="bt"><button class="btn neon sm" data-act="testok" data-id="${t.id}">${IC.chk} C'est bon</button><button class="btn rose sm" data-act="testko" data-id="${t.id}">${IC.x} Pas OK</button></div></div>`;
    else if(t.status==='attente')banner=`<div class="banner b-q">💬 Digitalia attend votre réponse. Répondez dans la discussion ci-dessous.</div>`;
    else if(t.status==='termine')banner=`<div class="banner b-ok">✅ Livrée. Un souci après coup ?<div class="bt"><button class="btn sm" data-act="reopen" data-id="${t.id}">Rouvrir</button></div></div>`;
    else if(t.status==='nouveau')banner=`<div class="banner b-dig">Reçue. Digitalia la qualifie sous 48 h et vous prévient.</div>`;
    else if(t.status==='devis')banner=`<div class="banner b-q">📄 Une proposition commerciale vous attend ci-dessous. Le développement démarre dès votre accord.</div>`;
    else if(t.status==='testint')banner=`<div class="banner b-dig">🔎 En validation interne chez Digitalia — vous le recevrez à tester dès que c'est vérifié.</div>`;
    else banner=`<div class="banner b-dig">Chez Digitalia — ${stepLabel(t)}${t.due?`, livraison prévue le ${fmtD(t.due)}`:''}.</div>`}
  else{
    if(t.status==='nouveau'||t.status==='analyser')banner=`<div class="banner b-dig">À qualifier.<div class="bt"><button class="btn sm" data-tab="triage" data-triage="${t.id}">Ouvrir dans le triage</button></div></div>`;
    else if(t.status==='cours')banner=`<div class="banner b-dig">En développement. Livré en préprod ?<div class="bt"><button class="btn grad sm" data-st="testint" data-id="${t.id}">Passer en test interne</button><button class="btn sm" data-st="attente" data-id="${t.id}">Demander une précision</button></div></div>`;
    else if(t.status==='testint')banner=`<div class="banner b-dig">🔎 Test interne — à valider par l'équipe avant envoi au client.<div class="bt"><button class="btn neon sm" data-st="test" data-id="${t.id}">${IC.chk} Validé, envoyer au client</button><button class="btn rose sm" data-st="cours" data-id="${t.id}">Retour en dev</button></div></div>`;
    else if(t.status==='faire')banner=`<div class="banner b-dig">Planifiée${t.ms?' · '+MILESTONES.find(m=>m.id===t.ms).name:''}.<div class="bt"><button class="btn grad sm" data-st="cours" data-id="${t.id}">Démarrer</button></div></div>`;
    else if(t.status==='devis')banner=`<div class="banner b-you">📄 Proposition envoyée, en attente de la décision du client.</div>`;
    else if(t.status==='attente'||t.status==='test')banner=`<div class="banner b-you">Chez le client depuis le ${fmtD(t.updated)}.<div class="bt"><button class="btn sm" data-act="ping" data-id="${t.id}">Relancer</button><button class="btn sm" data-st="cours" data-id="${t.id}">Reprendre</button></div></div>`;
    else if(t.status==='termine')banner=`<div class="banner b-ok">✅ Livrée le ${fmtD(t.closed)}.</div>`}
  const qb=t.quote?`<div class="card tight" style="border-color:rgba(255,193,77,.45)"><h3 style="margin-bottom:8px;color:var(--amber)">Proposition commerciale · ${{sent:'en attente de votre accord',accepted:'acceptée',refused:'refusée',draft:'brouillon'}[t.quote.status]}</h3><div style="font-family:'Space Grotesk';font-size:28px;font-weight:700;letter-spacing:-.02em">${fmtE(t.quote.amount)} <span class="hint" style="font-family:Inter;font-size:13px">HT · ${t.quote.parts===1?'en une fois':t.quote.parts===2?'50 % à la commande, 50 % à la livraison':'30 % / 40 % / 30 %'}</span></div><div class="desc" style="margin-top:8px">${esc(t.quote.desc)||'<span class="hint">Pas de détail.</span>'}</div><div class="hint" style="margin-top:8px">Envoyée le ${fmtDT(t.quote.sentAt)}${t.quote.decidedAt?` · réponse le ${fmtDT(t.quote.decidedAt)}`:''} · 📎 devis.pdf</div>
    ${t.quote.status==='sent'&&!isDig()?`<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn neon" data-quote="accept" data-id="${t.id}">${IC.chk} J'accepte la proposition</button><button class="btn rose" data-quote="refuse" data-id="${t.id}">Refuser</button><span class="hint" style="align-self:center">ou posez une question dans la discussion</span></div>`:''}
    ${t.quote.status==='sent'&&isDig()?`<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn sm" data-act="ping" data-id="${t.id}">Relancer le client</button><button class="btn sm" data-tab="triage" data-triage="${t.id}">Modifier la proposition</button></div>`:''}
    ${t.quote.status==='accepted'?`<div style="margin-top:10px">${t.quote.schedule.map(e=>`<div style="display:flex;gap:10px;align-items:center;padding:5px 0"><span class="ball ${e.paid?'you':'done'}">${e.paid?'Encaissée':'À venir'}</span><b>${fmtE(e.amount)}</b><span class="hint">${fmtD(e.date)}</span></div>`).join('')}</div>`:''}</div>`:'';
  const ko=state.ko&&state.ko.id===t.id?state.ko:null;const KT={testko:{h:'Ce test n\'est pas concluant — expliquez ce qui cloche',p:'Un texte, une photo, une vidéo ou un message vocal : l\'équipe corrige sans deviner.',btn:'Envoyer mon refus'},reopen:{h:'Rouvrir cette demande — que se passe-t-il ?',p:'Décrivez le problème rencontré après la livraison.',btn:'Rouvrir la demande'},qrefuse:{h:'Refuser la proposition — pour quelle raison ?',p:'Trop cher, hors périmètre, pas maintenant… ça aide Digitalia à ajuster.',btn:'Refuser la proposition'}};
  const koBlock=ko?`<div class="refus"><h3>${KT[ko.kind].h}</h3><p class="hint" style="margin-bottom:10px">${KT[ko.kind].p}</p><div class="compose"><textarea id="ko-txt" placeholder="Décrivez le problème : sur quelle page, ce que vous attendiez, ce qui s\'est passé…" style="min-height:100px">${esc(state.koTxt||'')}</textarea>${attBar()}${attList()}<div id="ko-err" class="hint" style="color:var(--rose);display:none">Il faut une explication écrite, vocale ou vidéo pour envoyer.</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px"><button class="btn ghost" data-kocancel>Annuler</button><button class="btn rose" data-kosend>${KT[ko.kind].btn}</button></div></div></div>`:'';
  if(ko)banner='';
  d.innerHTML=`<div class="dh"><button class="btn ghost sm" data-close>${IC.x}</button><span class="hint">${t.id} · ${p.name}${par?` · sous-tâche de <a data-open="${par.id}">${par.id}</a>`:''}</span><span style="margin-left:auto">${ballBadge(t,isDig())}</span></div>
  <div class="db"><div><div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">${typeTag(t)}${t.prio!=='Normale'?`<span class="tag" style="color:var(--rose)">${t.prio}</span>`:''}${!t.visible?'<span class="tag int">Interne</span>':''}</div><h1>${esc(t.title)}</h1>${t.visible?track(t,true):''}<div class="step-now" style="margin-top:6px">${stepLabel(t)}</div></div>
  ${koBlock}${banner}${qb}
  <div class="card tight"><h3 style="margin-bottom:8px">Description</h3><div class="desc">${t.desc?esc(t.desc):'<span class="hint">Pas de description.</span>'}</div>${t.files&&t.files.length?`<div class="att-list">${t.files.map(f=>attView(f)).join('')}</div>`:''}</div>
  ${subs.length?`<div class="card tight"><h3 style="margin-bottom:8px">Sous-tâches</h3>${subs.map(s=>`<div class="ti" data-open="${s.id}"><span class="why" style="background:var(--s3);color:var(--ink2)">${S[s.status].l}</span><div class="t">${esc(s.title)}</div>${av(USERS[s.assignee],1)}</div>`).join('')}</div>`:''}
  <div class="card tight"><h3 style="margin-bottom:10px">Discussion</h3>${t.comments.length?t.comments.map(c=>{const u=USERS[c.by];return `<div class="msg ${u.id===state.user.id?'me':''}">${av(u)}<div class="b"><div class="h"><b>${u.name}</b> · ${u.org} · ${fmtDT(c.at)}</div>${esc(c.txt)}${c.files&&c.files.length?`<div class="att-list">${c.files.map(f=>attView(f)).join('')}</div>`:''}</div></div>`}).join(''):'<p class="hint" style="margin-bottom:10px">Pas encore de message.</p>'}
    <div class="compose"><textarea id="cmt" placeholder="${isDig()?'Écrire au client ou à l\'équipe…':'Écrire à Digitalia…'}"></textarea>${ko?'':attBar()+attList()}<div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap"><button class="btn grad sm" data-comment="${t.id}">Envoyer</button></div></div></div>
  <div class="card tight"><h3 style="margin-bottom:10px">Informations</h3><div class="kv">

  if(D.msubmit!==undefined){const f=state.form;const key=isDig()?(f.project||state.project||'SCV'):(f.project||(cKey()==='all'?cProjs()[0]:cKey()));const n=Math.max(...TICKETS.filter(t=>t.project===key).map(t=>t.num))+1;

    TICKETS.push(t);state.att=[];state.modal=null;toast(isDig()?`${t.id} créé`:'Demande envoyée — Digitalia vous répond sous 48 h');state.drawer=t.id;render();return}
  if(D.open!==undefined){state.drawer=D.open;renderDrawer();return}
  if(D.close!==undefined){state.drawer=null;state.ko=null;state.att=[];state.koTxt='';renderDrawer();return}
  if(D.st!==undefined){const t=TICKETS.find(x=>x.id===D.id);setStatus(t,D.st);render();return}
  if(D.act!==undefined){const t=TICKETS.find(x=>x.id===D.id);
    if(D.act==='testok'){setStatus(t,'termine',true);toast('Merci ! Demande livrée ✓')}
    if(D.act==='testko'||D.act==='reopen'){state.ko={id:t.id,kind:D.act};state.att=[];state.drawer=t.id;renderDrawer();return}
    if(D.act==='ping'){t.comments.push({at:now(),by:state.user.id,txt:'Petit rappel : nous attendons votre retour pour avancer.'});toast('Relance envoyée au client')}
    render();return}
  if(D.comment!==undefined){const t=TICKETS.find(x=>x.id===D.comment);const v=$('#cmt').value;const att=state.att||[];if(!v.trim()&&!att.length)return;t.comments.push({at:now(),by:state.user.id,txt:v.trim(),files:att});state.att=[];t.updated=now();
    if(!isDig()&&t.status==='attente'){setStatus(t,'cours',true);toast('Réponse envoyée — la balle est chez Digitalia')}else toast('Message envoyé');render();return}
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.plead){proj(el.dataset.plead).lead=el.value;render();toast('Responsable mis à jour');return}
  if(el.dataset.job){USERS[el.dataset.job].job=el.value;render();toast('Rôle mis à jour');return}
  if(el.dataset.cproj!==undefined){state.cproj=el.value;state.ver='v24';render();return}
  if(el.dataset.attin!==undefined){const ko=$('#ko-txt');if(ko)state.koTxt=ko.value;addFiles(el.files);return}
  if(el.dataset.wf){const w=WF[+el.dataset.i];w[el.dataset.wf]=el.value;rebuildWF();render();return}
  if(el.dataset.kf){state.kf=state.kf||{};state.kf[el.dataset.kf]=el.type==='checkbox'?el.checked:el.value;render();return}
  if(el.dataset.finp){proj(el.dataset.key).fin[el.dataset.finp]=+el.value||0;render();return}
  if(el.dataset.finl){const l=proj(el.dataset.key).fin.licence;l[el.dataset.finl]=el.dataset.finl==='amount'?(+el.value||0):el.value;render();return}
  if(el.dataset.finc){const c=proj(el.dataset.key).fin.cost;c[el.dataset.finc]=el.type==='number'?(+el.value||0):el.value;render();return}
  if(el.dataset.costmode){proj(el.dataset.costmode).fin.cost={mode:el.value,tjm:FIN.tjm};render();return}
  if(el.dataset.sch){const e=proj(el.dataset.key).fin.schedule[+el.dataset.i];e[el.dataset.sch]=el.dataset.sch==='amount'?(+el.value||0):el.value;proj(el.dataset.key).fin.schedule.sort((a,b)=>a.date.localeCompare(b.date));render();return}
  if(el.dataset.paid){proj(el.dataset.paid).fin.schedule[+el.dataset.i].paid=el.checked;render();toast(el.checked?'Échéance encaissée':'Échéance en attente');return}
  if(el.dataset.sal){FIN.people[el.dataset.sal].salary=+el.value||0;render();return}
  if(el.dataset.alloc){const pc=FIN.people[el.dataset.alloc];pc.alloc=pc.alloc||{};pc.alloc[el.dataset.key]=+el.value||0;render();return}
  if(el.dataset.est){TICKETS.find(t=>t.id===el.dataset.est).est=+el.value||0;render();return}
  if(el.dataset.bill){TICKETS.find(t=>t.id===el.dataset.bill).billing=el.value;render();return}
  if(el.dataset.tjm!==undefined){FIN.tjm=+el.value||0;render();return}
  if(el.dataset.set){const t=TICKETS.find(x=>x.id===el.dataset.id);const k=el.dataset.set;
    if(k==='status')setStatus(t,el.value);else if(k==='visible')t.visible=el.value==='1';else{const lab={assignee:'responsable',due:'date prévue',ms:'version',prio:'priorité'}[k];const from=k==='assignee'?(t.assignee?USERS[t.assignee].name:'—'):(t[k]||'—');t[k]=el.value||null;const to=k==='assignee'?(t.assignee?USERS[t.assignee].name:'—'):(t[k]||'—');t.history.push({at:now(),by:state.user.name,txt:`a modifié ${lab} : ${from} → ${to}`});toast('Mis à jour')}
    t.updated=now();render()}});
document.addEventListener('input',e=>{if(e.target.id==='ko-txt'){state.koTxt=e.target.value}if(e.target.dataset.q!==undefined){clearTimeout(window._q);window._q=setTimeout(()=>{state.q=e.target.value;render();const i=$('[data-q]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)}});
document.addEventListener('submit',e=>{const f=e.target;if(f.id!=='login-form')return;e.preventDefault();const email=f.querySelector('[name=email]').value.trim().toLowerCase();const pw=f.querySelector('[name=password]').value;
  const u=Object.values(USERS).find(x=>(x.email||'').toLowerCase()===email);
  if(!u||pw!=='orbit'){state.loginEmail=email;state.loginErr='E-mail ou mot de passe incorrect.';render();return}
  if(u.active===false){state.loginEmail=email;state.loginErr='Ce compte est désactivé. Contactez Digitalia.';render();return}
  if(u.pending){u.pending=false}
  state.loginErr='';state.loginEmail='';state.user=u;state.tab=isDig()?'cockpit':'home';state.q='';render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal){state.modal=null;renderModal()}else if(state.drawer){state.drawer=null;renderDrawer()}}});
function bindDnd(){let dragId=null;document.querySelectorAll('[data-kdrag]').forEach(c=>{c.addEventListener('dragstart',e=>{dragId=c.dataset.kdrag;c.classList.add('dragging');e.dataTransfer.effectAllowed='move'});c.addEventListener('dragend',()=>c.classList.remove('dragging'))});
  document.querySelectorAll('.kc').forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');const t=TICKETS.find(x=>x.id===dragId);if(!t)return;const sts=col.dataset.kst.split(',');if(sts.includes(t.status))return;const target=sts.find(k=>canGo(t,k))||sts[0];setStatus(t,target);render()})})}
const _render=render;render=function(){_render();bindDnd()};
document.addEventListener('dragover',e=>{if(e.target.closest('#drawer'))e.preventDefault()});
document.addEventListener('drop',e=>{if(e.target.closest('#drawer')&&e.dataTransfer.files.length){e.preventDefault();const ko=$('#ko-txt');if(ko)state.koTxt=ko.value;addFiles(e.dataTransfer.files)}});
render();
</script>
</body>
</html>
